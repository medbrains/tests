<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedBrains tests</title>
<style>
  :root { --bg:#fff; --fg:#0b1220; --muted:#5d677a; --line:#dde2ea; --blue:#0043ce; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111315; --fg:#e6e8eb; --muted:#a9afb7; --line:#30343a; --blue:#78a9ff; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 "IBM Plex Sans", system-ui, sans-serif; }
  main { max-width:40rem; margin:0 auto; padding:4rem max(16px, env(safe-area-inset-left)); }
  h1 { font-size:1.75rem; margin:0 0 .5rem; }
  p { color:var(--muted); }
  a { color:var(--blue); }
  nav { margin-top:2rem; padding-top:1rem; border-top:1px solid var(--line); display:flex; gap:1.5rem; flex-wrap:wrap; }
</style>
<main>
  <h1>MedBrains test report</h1>
  <p>The report is being set up. Soon this page will show every MedBrains test (server, web app and whole-journey tests), whether it passed, and how that has changed over time.</p>
  <nav><a href="https://docs.medbrains.in">Docs</a><a href="https://github.com/medbrains/medbrains">Source code</a><a href="https://www.medbrains.in">medbrains.in</a></nav>
</main>
</html>
